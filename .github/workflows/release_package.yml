name: Release package

# Publishes terra-react to npm at the version already in package.json. Bump the
# version (and native SDK pins) in a PR first, merge, then create a GitHub
# Release whose tag is the version (e.g. 1.9.7) — this workflow publishes it.
#
# This does NOT bump the version itself (the previous workflow did, which
# double-bumped and pushed to protected master). It skips the package's
# prepublishOnly lint gate via --ignore-scripts (lint has pre-existing errors);
# the build still runs through `npm ci` (the `prepare` script).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: https://registry.npmjs.org/
      - name: Install + build
        run: npm ci
      - name: Publish to npm
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}
